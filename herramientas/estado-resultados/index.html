<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Utilidad bruta, operativa y neta, con participación de trabajadores e impuesto a la renta">
<title>Estado de resultados</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../compartido/base.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><i class="fas fa-chart-column" aria-hidden="true"></i> Estado de resultados</h1>
      <p>Utilidad bruta, operativa y neta, con participación de trabajadores e impuesto a la renta</p>
    </div>
  </header>

  <div class="grid-calc">
    <section class="card" aria-labelledby="t-datos">
      <h2 id="t-datos"><i class="fas fa-pen-to-square" aria-hidden="true"></i> Datos</h2>
      <form id="form"></form>
    </section>
    <section class="card" aria-labelledby="t-resultado">
      <h2 id="t-resultado"><i class="fas fa-chart-simple" aria-hidden="true"></i> Resumen</h2>
      <div id="resultado" aria-live="polite"></div>
    </section>
  </div>

  <section class="card" id="detalle" aria-labelledby="t-detalle" hidden>
    <div class="card-head">
      <h2 id="t-detalle"><i class="fas fa-file-invoice" aria-hidden="true"></i> Estado de resultados</h2>
      <div class="acciones"><button type="button" class="btn btn-excel" id="btnExcel"><i class="fas fa-file-excel" aria-hidden="true"></i> Exportar a Excel</button></div>
    </div>
    <div id="detalleContenido"></div>
  </section>

  <footer class="pie">Herramientas Contables · cálculo referencial, verifica con la norma vigente</footer>
</div>
<script src="../../compartido/util.js"></script>
<script src="../../compartido/parametros.js"></script>
<script src="../../compartido/base.js"></script>
<script src="js/calculo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
